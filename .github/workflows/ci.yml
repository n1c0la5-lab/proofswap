name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: clippy (wasm32)
        run: cargo clippy --target wasm32-unknown-unknown -p proofswap-xmr-verify --locked -- -D warnings
      - name: test
        run: cargo test --locked
      - name: build wasm32-unknown-unknown
        run: cargo build --target wasm32-unknown-unknown -p proofswap-xmr-verify --release --locked
      - name: script syntax
        run: python3 -m py_compile scripts/gen-test-vectors.py
